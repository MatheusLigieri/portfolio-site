          <p class="lead">Senior Software Engineer: arquitetura, integração e operação de plataformas digitais em escala.</p>
          <h2>Casos</h2>
          <ul>
            <li>Orchestrator: engine que move diariamente ~300 mil carrinhos para uma base de menor custo, num checkout omnichannel com 8+ tipos de produto.</li>
            <li>Click &amp; Retira: integração entre fretes, plataforma de pedidos, omnichannel e lojas físicas, com rollout controlado loja a loja.</li>
            <li>Next-Day: teste A/B na engine de frete e modalidade modular, com elegibilidade por CEP, estoque, CD, horário de corte e transportadora.</li>
            <li>Campanha de TV com QR Code: backend completo do sorteio e dos carrinhos de uma campanha em que QR Codes nos comerciais de TV liberavam descontos.</li>
            <li>Pagamentos sem fila travada: arquitetura orientada a eventos para pagamentos e reembolsos médicos.</li>
            <li>Imagens em tempo real: microsserviços orientados a eventos para câmeras de acesso de um bairro.</li>
